name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, pwsh latest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable

      # Test runs last: in CI mode Pester exits the process with the failure count.
      - name: Bootstrap, analyze, package and test
        shell: pwsh
        run: ./build/build.ps1 -Task Bootstrap, Analyze, Package, Test -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: out/testResults.xml
          if-no-files-found: ignore

  test-minimum-version:
    name: Test (ubuntu-latest, pwsh 7.2)
    runs-on: ubuntu-latest
    env:
      PWSH_VERSION: 7.2.24
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/pwsh-$PWSH_VERSION"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v$PWSH_VERSION/powershell-$PWSH_VERSION-linux-x64.tar.gz" -o "$RUNNER_TEMP/pwsh.tar.gz"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$dest"
          chmod +x "$dest/pwsh"
          echo "PWSH_MIN=$dest/pwsh" >> "$GITHUB_ENV"

      - name: Bootstrap, analyze, package and test
        run: |
          "$PWSH_MIN" -NoProfile -Command '$PSVersionTable; ./build/build.ps1 -Task Bootstrap, Analyze, Package, Test -CI'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pwsh-7.2
          path: out/testResults.xml
          if-no-files-found: ignore
